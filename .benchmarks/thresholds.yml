# Autosubmit benchmark regression thresholds.
#
# For each metric, `threshold` is the maximum allowed relative increase (in %,
# worse direction only) before the report flags a regression. `floor` is the
# minimum absolute value of the current measurement required before the
# threshold applies: tiny/zero values are dominated by noise, so they are not
# judged.
#
# `exact_metrics` are deterministic values that must not change at all between
# runs (e.g. the experiment structure).
#
# Initial values were calibrated against the variance observed in
# .benchmarks/artifacts/performance-metrics-4.2.0.csv. Tune them after a few
# benchmark cycles on the GitHub-hosted runner (wall-clock time and memory are
# the noisiest metrics; the deterministic counters should never move).
metrics:
  Time Taken(Seconds):
    threshold: 15.0
    floor: 1.0
  Memory consumption(MiB):
    threshold: 10.0
    floor: 50.0
  Historical DB Disk Usage(MiB):
    threshold: 20.0
    floor: 1.0
  Job list DB Usage:
    threshold: 20.0
    floor: 1.0
  FD GROW:
    threshold: 25.0
    floor: 1.0
  MEM GROW(MIB):
    threshold: 25.0
    floor: 1.0
  OBJ GROW:
    threshold: 25.0
    floor: 1.0

exact_metrics:
  - Total Jobs
  - Total Dependencies
